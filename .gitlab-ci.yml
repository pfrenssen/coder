################
# GitLab CI configuration for Coder project
################

variables:
  COMPOSER_HOME: "$CI_PROJECT_DIR/.composer"

.test-template:
  image: php:$PHP_VERSION-alpine
  before_script:
    - apk add --no-cache git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-progress --prefer-dist --optimize-autoloader
  script:
    - ./vendor/bin/phpunit
    - ./vendor/bin/phpcs
    - ./vendor/bin/phpcs -p --standard=tests/Drupal/phpcs-ruleset.xml tests/Drupal/good/ --ignore=tests/Drupal/good/GoodUnitTest.php
    - ./vendor/bin/phpcs -p --standard=coder_sniffer/DrupalPractice tests/DrupalPractice/good/ --ignore=tests/DrupalPractice/good/GoodUnitTest.php

# PHP 7.4 - 8.5 tests
test:php:
  extends: .test-template
  parallel:
    matrix:
      - PHP_VERSION: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]

# PHPStan analysis
phpstan:
  extends: .test-template
  variables:
    PHP_VERSION: "8.5"
  script:
    - ./vendor/bin/phpstan analyse --memory-limit=256M

# Cspell spell checking
cspell:
  image: node:alpine
  script:
    - npm install -g cspell
    - cspell "**/*"

# Drupal core regression tests
drupal-core:
  extends: .test-template
  variables:
    PHP_VERSION: "8.5"
  script:
    - git clone --depth 1 --branch 11.x https://git.drupalcode.org/project/drupal.git drupal
    - cd drupal/core
    # Fix Drupal core PHPCS config by replacing removed sniffs
    - sed -i 's/Drupal.Classes.ClassCreateInstance/SlevomatCodingStandard.ControlStructures.NewWithParentheses/g' phpcs.xml.dist
    - sed -i 's/Drupal.Classes.UnusedUseStatement/SlevomatCodingStandard.Namespaces.UnusedUses/g' phpcs.xml.dist
    - sed -i '/<rule ref="SlevomatCodingStandard.Exceptions.RequireNonCapturingCatch" \/>/a \  <rule ref="SlevomatCodingStandard.Namespaces.UseFromSameNamespace"/>' phpcs.xml.dist
    - sed -i 's@<rule ref="Drupal.Classes.ClassFileName"/>@<rule ref="Squiz.Classes.ClassFileName">\n    <!-- Disable class name to file name matching for *Test.php files. -->\n    <exclude-pattern>*/tests/*/*(Test|TestBase).php</exclude-pattern>\n  </rule>@' phpcs.xml.dist
    - sed -i 's/Drupal.Classes.UseLeadingBackslash/SlevomatCodingStandard.Namespaces.UseDoesNotStartWithBackslash/g' phpcs.xml.dist
    - find . -type f -name "*.php" -exec sed -i 's#// phpcs:ignore Drupal.Classes.PropertyDeclaration, Drupal.NamingConventions.ValidVariableName.LowerCamelName, Drupal.Commenting.VariableComment.Missing#// phpcs:ignore Drupal.NamingConventions.ValidVariableName.LowerCamelName,PSR2.Classes.PropertyDeclaration.Underscore#g' {} +
    - find . -type f -name "*.php" -exec sed -i 's#// @codingStandardsIgnoreLine#// phpcs:ignore#g' {} +
    - find . -type f -name "*.php" -exec sed -i 's#// @codingStandardsIgnoreFile#// phpcs:ignoreFile#g' {} +
    - find . -type f -exec sed -i '/\/\/ phpcs:ignore/ s/, /,/g' {} +
    - find . -type f -name "*.php" -exec sed -i 's#// @codingStandardsIgnoreStart#// phpcs:disable#g' {} +
    - find . -type f -name "*.php" -exec sed -i 's#// @codingStandardsIgnoreEnd#// phpcs:enable#g' {} +
    - sed -i '/<rule ref="Drupal.Functions.FunctionDeclaration"\/>/d' phpcs.xml.dist
    - sed -i 's/DrupalPractice.CodeAnalysis.VariableAnalysis/VariableAnalysis.CodeAnalysis.VariableAnalysis/g' phpcs.xml.dist
    - find .. -type f -name "*.php" -exec sed -i 's#// phpcs:ignore DrupalPractice.CodeAnalysis.VariableAnalysis#// phpcs:ignore VariableAnalysis.CodeAnalysis.VariableAnalysis#g' {} +
    - sed -i 's/Drupal.Methods.MethodDeclaration/PSR2.Methods.MethodDeclaration/g' phpcs.xml.dist
    - sed -i '/<rule ref="Drupal.WhiteSpace.Namespace"\/>/d' phpcs.xml.dist
    - sed -i 's/Drupal.Classes.InterfaceName/Generic.NamingConventions.InterfaceNameSuffix/g' phpcs.xml.dist
    - sed -i '/<rule ref="Drupal.Commenting.DataTypeNamespace"\/>/d' phpcs.xml.dist
    - sed -i 's/Drupal.ControlStructures.ElseIf/PSR2.ControlStructures.ElseIfDeclaration/g' phpcs.xml.dist
    - sed -i 's/Drupal.ControlStructures.InlineControlStructure/Generic.ControlStructures.InlineControlStructure/g' phpcs.xml.dist
    - ../../vendor/bin/phpcs -p -s --parallel=$(nproc) -d memory_limit=2G --exclude=Drupal.ControlStructures.ControlSignature,Drupal.Arrays.Array --ignore=lib/Drupal/Core/Command/GenerateTheme.php,modules/mysql/tests/src/Kernel/mysql/Console/DbDumpCommandTest.php,modules/big_pipe/tests/modules/big_pipe_test/src/BigPipePlaceholderTestCases.php,tests/fixtures/plugins/CustomPlugin.php,modules/package_manager/tests/modules/package_manager_test_api/src/ApiController.php,modules/views/tests/src/Kernel/Plugin/StyleGridTest.php,tests/Drupal/Tests/Core/Utility/CallableResolverTest.php,tests/Drupal/Tests/Component/DrupalComponentTest.php,tests/Drupal/Tests/Component/Utility/VariableTest.php,modules/system/tests/src/Functional/System/ErrorHandlerTest.php,modules/migrate_drupal/tests/src/Unit/MigrationStateUnitTest.php,modules/jsonapi/tests/src/Unit/EventSubscriber/ResourceResponseValidatorTest.php,modules/jsonapi/tests/src/Kernel/Query/FilterTest.php
